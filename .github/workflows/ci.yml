name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Pi and TypeScript
        run: npm install --global @earendil-works/pi-coding-agent@1.0.1 typescript@5.9.3

      - name: Configure Pi host resolution
        run: echo "PI_PLAN_HOST_ROOT=$(npm root --global)/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          node --version
          npm --version
          python3 --version
          pi --version
          tsc --version

      - name: Check types
        run: npm run check

      - name: Run full test suite
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts
